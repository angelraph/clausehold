[package]
name = "sandbox-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Downloads the Linux/macOS neard sandbox binary at build time.
# Testnet-only runs (e.g. on Windows) use --no-default-features.
default = ["sandbox"]
sandbox = ["near-workspaces/install"]

[dev-dependencies]
near-workspaces = { version = "0.24", default-features = false, features = ["rustls"] }
near-primitives = "0.38"
near-crypto = "0.38"
near-jsonrpc-client = "0.23"
near-jsonrpc-primitives = "0.38"
near-gas = "0.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
